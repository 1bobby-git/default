name: Temporary Apti Android probe

on:
  push:
    branches:
      - analysis/apti-emulator-20260901
    paths:
      - .github/workflows/apti-emulator-probe.yml
      - scripts/apti-version-spoof.js
      - scripts/apti-frida-runner.py
      - scripts/apti-ui-discovery.sh
  workflow_dispatch:

permissions:
  contents: read

env:
  APTI_VERSION: "3.3.45"

jobs:
  ui-discovery:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' |
            sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Boot Android 11, spoof current version and inspect UI
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          profile: pixel_5
          disable-animations: true
          emulator-options: >-
            -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
            -camera-back none -camera-front none
          script: |
            chmod +x scripts/apti-ui-discovery.sh
            scripts/apti-ui-discovery.sh
      - name: Upload UI discovery results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apti-ui-discovery
          path: apti-ui-discovery-results/
          if-no-files-found: warn
          retention-days: 1
