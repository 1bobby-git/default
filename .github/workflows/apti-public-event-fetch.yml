name: Temporary Apti public event fetch

on:
  push:
    branches:
      - analysis/apti-emulator-20260901
    paths:
      - .github/workflows/apti-public-event-fetch.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch-public-event:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Fetch public event resources
        run: |
          set -euo pipefail
          mkdir -p apti-public-event
          ua='Mozilla/5.0 (Linux; Android 15; Pixel 5 Build/AP3A.241105.008; wv) AppleWebKit/537.36 (KHTML, like Gecko) Version/4.0 Chrome/152.0.0.0 Mobile Safari/537.36'
          base='https://v2notice.apti.co.kr/resource/pages/event/APTI000574'
          curl -fsS --retry 5 --retry-delay 2 -A "$ua" -D apti-public-event/app_event.headers.txt "$base/app_event.html?isShare=Y" -o apti-public-event/app_event.html
          curl -fsS --retry 5 --retry-delay 2 -A "$ua" -D apti-public-event/app_event_js.headers.txt "$base/app_event.js" -o apti-public-event/app_event.js
          sha256sum apti-public-event/app_event.html apti-public-event/app_event.js > apti-public-event/sha256.txt
          wc -c apti-public-event/app_event.html apti-public-event/app_event.js > apti-public-event/sizes.txt

      - name: Upload public event resources
        uses: actions/upload-artifact@v4
        with:
          name: apti-public-event-${{ github.run_id }}
          path: apti-public-event/
          if-no-files-found: error
          retention-days: 1
