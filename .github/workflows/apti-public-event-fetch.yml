name: Temporary Apti public event fetch

on:
  push:
    branches:
      - analysis/apti-emulator-20260901
    paths:
      - .github/workflows/apti-public-event-fetch.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch-public-event:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Fetch public event resources
        run: |
          set -euo pipefail
          mkdir -p apti-public-event
          ua='Mozilla/5.0 (Linux; Android 15; Pixel 5 Build/AP3A.241105.008; wv) AppleWebKit/537.36 (KHTML, like Gecko) Version/4.0 Chrome/152.0.0.0 Mobile Safari/537.36'
          host='https://v2notice.apti.co.kr/resource'
          fetch() {
            local remote="$1" local_name="$2"
            curl -fsS --retry 5 --retry-delay 2 -A "$ua" -D "apti-public-event/${local_name}.headers.txt" "$host/$remote" -o "apti-public-event/$local_name"
          }
          fetch 'pages/event/APTI000574/app_event.html?isShare=Y' 'app_event.html'
          fetch 'pages/event/APTI000574/app_event.js' 'app_event.js'
          fetch 'pages/utils.js' 'utils.js'
          fetch 'pages/nativeHandler.js' 'nativeHandler.js'
          fetch 'pages/nativeScheme.js' 'nativeScheme.js'
          fetch 'pages/common/marketingBanner.js' 'marketingBanner.js'
          fetch 'assets/share/shareInfo.js' 'shareInfo.js'
          fetch 'assets/css/APTI000574/app_event.css' 'app_event.css'
          sha256sum apti-public-event/*.{html,js,css} > apti-public-event/sha256.txt
          wc -c apti-public-event/*.{html,js,css} > apti-public-event/sizes.txt

      - name: Upload public event resources
        uses: actions/upload-artifact@v4
        with:
          name: apti-public-event-${{ github.run_id }}
          path: apti-public-event/
          if-no-files-found: error
          retention-days: 1
