name: Temporary secure Apti login probe v3

on:
  push:
    branches:
      - analysis/apti-emulator-20260901
    paths:
      - .github/workflows/apti-secure-login-probe-v3.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  APTI_XAPK_URL: https://d.apkpure.net/b/XAPK/aptip.app?version=latest
  APTI_XAPK_SHA256: 5484493059885e8ae8d070a147e47459238eeafde2eb8d6737d9ed756510744b
  APTI_CREDENTIALS_FILE: /dev/shm/apti-creds.json
  APTI_EXCHANGE_BASE_URL: https://filebin.net/apti-cf1e0ab347924fdc8b61579a2e3046d9

jobs:
  secure-login-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 85
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct probe scripts
        run: |
          set -euo pipefail
          cat scripts/apti_bundle_part_00 scripts/apti_bundle_part_01 scripts/apti_bundle_part_02 | base64 -d > /tmp/apti-secure-scripts.tar.gz
          echo "d3c48ce5094e308f6e9aa7a22eab84327a0841fde35a7ef5f657d647b987c9f6  /tmp/apti-secure-scripts.tar.gz" | sha256sum -c -
          tar -xzf /tmp/apti-secure-scripts.tar.gz -C scripts
          chmod 700 scripts/apti_secure_probe.py scripts/apti_secure_cdp.py scripts/apti_exact_https_probe.py
          chmod 700 scripts/apti_emulator_wrapper.sh scripts/apti_encrypt_outputs.py
          rm -f /tmp/apti-secure-scripts.tar.gz

      - name: Generate and publish one-time public key
        run: |
          set -euo pipefail
          umask 077
          mkdir -p /dev/shm/apti-handshake apti-handshake-public
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:4096 -out /dev/shm/apti-handshake/private.pem
          openssl pkey -in /dev/shm/apti-handshake/private.pem -pubout -out apti-handshake-public/public.pem
          printf '%s\n' "$GITHUB_RUN_ID" > apti-handshake-public/run-id.txt
          printf '%s\n' "$GITHUB_SHA" > apti-handshake-public/commit-sha.txt
          python3 - <<'PY'
          import secrets
          from pathlib import Path
          Path('apti-handshake-public/nonce.txt').write_text(secrets.token_hex(24) + '\n', encoding='utf-8')
          PY
          base="${APTI_EXCHANGE_BASE_URL%/}"
          for file_name in public.pem run-id.txt commit-sha.txt nonce.txt; do
            remote_name="${file_name%.*}-${GITHUB_RUN_ID}.${file_name##*.}"
            curl -fsS --retry 8 --retry-delay 2 --retry-all-errors \
              -H 'Content-Type: application/octet-stream' \
              --data-binary "@apti-handshake-public/${file_name}" \
              "${base}/${remote_name}" >/dev/null
          done
          printf '%s\n' "$GITHUB_RUN_ID" > /dev/shm/apti-handshake/latest-run-id.txt
          curl -fsS --retry 8 --retry-delay 2 --retry-all-errors \
            -H 'Content-Type: application/octet-stream' \
            --data-binary '@/dev/shm/apti-handshake/latest-run-id.txt' \
            "${base}/latest-run-id.txt" >/dev/null

      - name: Upload one-time public key artifact
        uses: actions/upload-artifact@v4
        with:
          name: apti-handshake-${{ github.run_id }}
          path: apti-handshake-public/
          if-no-files-found: error
          retention-days: 1

      - name: Receive and validate encrypted credentials
        run: |
          set -euo pipefail
          umask 077
          mkdir -p /dev/shm/apti-handshake
          payload_url="${APTI_EXCHANGE_BASE_URL%/}/payload-${GITHUB_RUN_ID}.b64"
          found=0
          for _ in $(seq 1 360); do
            if curl -fsS --retry 2 --retry-delay 1 --retry-all-errors \
              "$payload_url" > /dev/shm/apti-handshake/payload.txt 2>/dev/null; then
              if base64 -d /dev/shm/apti-handshake/payload.txt > /dev/shm/apti-handshake/payload.bin 2>/dev/null; then
                found=1
                break
              fi
            fi
            sleep 5
          done
          if [[ "$found" -ne 1 ]]; then
            echo 'Encrypted credential payload was not received.'
            exit 20
          fi
          openssl pkeyutl -decrypt \
            -inkey /dev/shm/apti-handshake/private.pem \
            -in /dev/shm/apti-handshake/payload.bin \
            -out "$APTI_CREDENTIALS_FILE" \
            -pkeyopt rsa_padding_mode:oaep \
            -pkeyopt rsa_oaep_md:sha256
          python3 - <<'PY'
          import base64
          import json
          import os
          from pathlib import Path
          path = Path(os.environ.get('APTI_CREDENTIALS_FILE', '/dev/shm/apti-creds.json'))
          data = json.loads(path.read_text(encoding='utf-8'))
          assert isinstance(data.get('username'), str) and data['username']
          assert isinstance(data.get('password'), str) and data['password']
          assert str(data.get('run_id')) == os.environ['GITHUB_RUN_ID']
          key = base64.b64decode(data.get('result_key_b64', ''), validate=True)
          assert len(key) == 32
          Path('/dev/shm/apti-result-key.bin').write_bytes(key)
          path.chmod(0o600)
          PY
          apti_user="$(jq -r '.username' "$APTI_CREDENTIALS_FILE")"
          apti_pass="$(jq -r '.password' "$APTI_CREDENTIALS_FILE")"
          result_key_b64="$(jq -r '.result_key_b64' "$APTI_CREDENTIALS_FILE")"
          echo "::add-mask::$apti_user"
          echo "::add-mask::$apti_pass"
          echo "::add-mask::$result_key_b64"
          shred -u /dev/shm/apti-handshake/payload.bin /dev/shm/apti-handshake/payload.txt /dev/shm/apti-handshake/private.pem 2>/dev/null || true
          rm -rf apti-handshake-public
          echo 'Encrypted credentials received and validated.'

      - name: Install host analysis tools
        run: |
          python3 -m pip install --disable-pip-version-check -q mitmproxy websocket-client frida-tools cryptography
          sudo apt-get update -qq
          sudo apt-get install -y -qq jq unzip xz-utils >/dev/null

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Boot Android 15 with Chrome and run authenticated probe
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis_playstore
          profile: pixel_5
          cores: 2
          ram-size: 4096M
          heap-size: 768M
          disable-animations: true
          emulator-options: >-
            -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
            -camera-back none -camera-front none
            -no-snapshot-save -no-snapshot-load
          script: bash scripts/apti_emulator_wrapper.sh

      - name: Encrypt all probe outputs
        if: always()
        run: python3 scripts/apti_encrypt_outputs.py

      - name: Publish encrypted result to one-time exchange
        if: always()
        run: |
          set -euo pipefail
          result_file="apti-encrypted-output/apti-results-${GITHUB_RUN_ID}.bin"
          if [[ -s "$result_file" ]]; then
            curl -fsS --retry 8 --retry-delay 2 --retry-all-errors \
              -H 'Content-Type: application/octet-stream' \
              --data-binary "@${result_file}" \
              "${APTI_EXCHANGE_BASE_URL%/}/result-${GITHUB_RUN_ID}.bin" >/dev/null
            echo 'Encrypted probe result published.'
          else
            echo 'Encrypted probe result was not produced.'
          fi

      - name: Upload encrypted result artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apti-encrypted-result-${{ github.run_id }}
          path: apti-encrypted-output/
          if-no-files-found: error
          retention-days: 1
